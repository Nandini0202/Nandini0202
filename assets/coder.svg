<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F172A"/>
    <stop offset="0.55" stop-color="#2B2A5C"/>
    <stop offset="1" stop-color="#1F5F6B"/>
  </linearGradient>
</defs>
<style>
  .tw{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .ln{transform-box:fill-box;transform-origin:left center;animation:grow 5s ease-in-out infinite}
  @keyframes grow{0%{transform:scaleX(0)}30%{transform:scaleX(1)}85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .a1{animation:tap .45s ease-in-out infinite alternate}
  .a2{animation:tap .45s ease-in-out .22s infinite alternate}
  @keyframes tap{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  .fl{animation:fl 4s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .st{animation:st 3s ease-in-out infinite}
  @keyframes st{0%{opacity:0;transform:translateY(0)}50%{opacity:.7}100%{opacity:0;transform:translateY(-18px)}}
  .bl{animation:bl 1s steps(1) infinite}
  @keyframes bl{0%{opacity:1}50%{opacity:0}}
  .nod{transform-box:fill-box;transform-origin:center bottom;animation:nod 2.5s ease-in-out infinite}
  @keyframes nod{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2deg)}}
  text{font-family:Consolas,Menlo,monospace}
</style>

<rect width="900" height="340" rx="18" fill="url(#bg)"/>

<!-- stars -->
<g fill="#F1F5F9">
  <circle class="tw" cx="60" cy="40" r="2"/>
  <circle class="tw" style="animation-delay:.6s" cx="170" cy="85" r="1.6"/>
  <circle class="tw" style="animation-delay:1.2s" cx="330" cy="35" r="2"/>
  <circle class="tw" style="animation-delay:1.8s" cx="470" cy="70" r="1.5"/>
  <circle class="tw" style="animation-delay:.3s" cx="620" cy="38" r="2"/>
  <circle class="tw" style="animation-delay:2.1s" cx="720" cy="95" r="1.6"/>
  <circle class="tw" style="animation-delay:1s" cx="860" cy="150" r="1.8"/>
  <circle class="tw" style="animation-delay:2.4s" cx="40" cy="170" r="1.5"/>
</g>

<!-- moon -->
<circle cx="810" cy="62" r="40" fill="#F1F5F9" opacity=".08"/>
<circle cx="810" cy="62" r="24" fill="#E2E8F0" opacity=".9"/>

<!-- title -->
<text x="40" y="60" font-size="18" fill="#A5B4FC">&gt; building something cool<tspan class="bl" fill="#8FD3C2">_</tspan></text>

<!-- floating symbols -->
<text class="fl" x="130" y="130" font-size="30" fill="#8FD3C2">{ }</text>
<text class="fl" style="animation-delay:1.2s" x="560" y="85" font-size="28" fill="#D4A373">AI</text>
<text class="fl" style="animation-delay:2.2s" x="720" y="140" font-size="26" fill="#A5B4FC">&lt;/&gt;</text>

<!-- floor and desk -->
<rect x="0" y="300" width="900" height="40" fill="#0B1220" opacity=".45"/>
<rect x="120" y="280" width="10" height="22" fill="#3B3A6B"/>
<rect x="770" y="280" width="10" height="22" fill="#3B3A6B"/>

<!-- chair -->
<rect x="205" y="170" width="20" height="115" rx="9" fill="#3B3A6B"/>
<rect x="205" y="278" width="110" height="10" rx="5" fill="#3B3A6B"/>

<!-- person -->
<g>
  <rect x="236" y="170" width="72" height="104" rx="28" fill="#6D5BA8"/>
  <rect x="250" y="270" width="72" height="20" rx="10" fill="#1E293B"/>
  <g class="nod">
    <rect x="246" y="118" width="18" height="66" rx="9" fill="#1E1B3A"/>
    <circle cx="285" cy="136" r="32" fill="#E0B79A"/>
    <path d="M251 134 C250 100 284 92 306 112 C296 108 270 110 258 128 Z" fill="#1E1B3A"/>
    <circle cx="303" cy="138" r="3.2" fill="#0F172A"/>
    <path d="M300 152 Q306 156 312 151" stroke="#9A5B4A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
</g>

<!-- laptop -->
<rect x="410" y="118" width="250" height="144" rx="10" fill="#0B1220" stroke="#4F7CAC" stroke-width="3"/>
<circle cx="426" cy="132" r="3" fill="#B5835A"/>
<circle cx="438" cy="132" r="3" fill="#D4A373"/>
<circle cx="450" cy="132" r="3" fill="#8FD3C2"/>
<rect class="ln" x="426" y="150" width="90"  height="8" rx="4" fill="#8FD3C2"/>
<rect class="ln" style="animation-delay:.5s" x="442" y="166" width="150" height="8" rx="4" fill="#A5B4FC"/>
<rect class="ln" style="animation-delay:1s"  x="442" y="182" width="110" height="8" rx="4" fill="#D4A373"/>
<rect class="ln" style="animation-delay:1.5s" x="442" y="198" width="170" height="8" rx="4" fill="#8FD3C2"/>
<rect class="ln" style="animation-delay:2s"  x="426" y="214" width="70"  height="8" rx="4" fill="#A5B4FC"/>
<rect class="ln" style="animation-delay:2.5s" x="442" y="230" width="125" height="8" rx="4" fill="#C7D2FE"/>
<rect class="bl" x="575" y="228" width="8" height="12" fill="#8FD3C2"/>
<rect x="392" y="260" width="286" height="10" rx="5" fill="#64748B"/>

<!-- arms (typing) -->
<g class="a1">
  <line x1="290" y1="204" x2="418" y2="256" stroke="#6D5BA8" stroke-width="17" stroke-linecap="round"/>
  <circle cx="420" cy="256" r="9" fill="#E0B79A"/>
</g>
<g class="a2">
  <line x1="296" y1="214" x2="440" y2="257" stroke="#5B4B94" stroke-width="17" stroke-linecap="round"/>
  <circle cx="442" cy="257" r="9" fill="#E0B79A"/>
</g>

<!-- desk top -->
<rect x="60" y="268" width="780" height="14" rx="7" fill="#3B3A6B"/>
<rect x="60" y="268" width="780" height="4" rx="2" fill="#4F4E8A"/>

<!-- coffee -->
<rect x="705" y="236" width="28" height="32" rx="6" fill="#B5835A"/>
<path d="M733 244 q14 2 0 18" stroke="#B5835A" stroke-width="5" fill="none"/>
<path class="st" d="M714 228 q-6 -8 0 -14" stroke="#F1F5F9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path class="st" style="animation-delay:1.2s" d="M724 228 q-6 -8 0 -14" stroke="#F1F5F9" stroke-width="2.5" fill="none" stroke-linecap="round"/>

<!-- plant -->
<rect x="790" y="238" width="38" height="30" rx="5" fill="#B5835A"/>
<ellipse cx="800" cy="220" rx="9" ry="22" fill="#3F8F83" transform="rotate(-25 800 220)"/>
<ellipse cx="816" cy="216" rx="9" ry="24" fill="#2F7A70" transform="rotate(20 816 216)"/>
<ellipse cx="809" cy="212" rx="8" ry="22" fill="#4FA395"/>
</svg>
